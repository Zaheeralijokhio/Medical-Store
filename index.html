    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function () {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') || Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (desc && desc.configurable && !desc.set) {
            var currentFetch = window.fetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (fn) {
                if (typeof fn === 'function') {
                  currentFetch = fn;
                }
              },
            });
          }
        } catch (e) {}

        window.addEventListener(
          'error',
          function (event) {
            var msg = (event && event.message) || '';
            var file = (event && event.filename) || '';
            if (
              msg.indexOf('Cannot set property fetch') !== -1 ||
              file.indexOf('chrome-extension://') === 0 ||
              file.indexOf('moz-extension://') === 0
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return false;
            }
          },
          true
        );
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        try {
          var BUILD_VER = 'pharmacare_build_v25';
          if (localStorage.getItem('pharmacare_active_build') !== BUILD_VER) {
            [
              'pharmacare_deleted_ids',
              'pharmacare_sales',
              'pharmacare_returns',
              'pharmacare_purchases',
              'pharmacare_suppliers',
              'pharmacare_customers',
              'pharmacare_expenses',
              'pharmacare_adjustments',
              'pharmacare_audit_logs',
              'pharmacare_notifications'
            ].forEach(function (k) {
              localStorage.removeItem(k);
            });
            localStorage.setItem('pharmacare_active_build', BUILD_VER);
            if ('caches' in window) {
              caches.keys().then(function (keys) {
                keys.forEach(function (k) {
                  caches.delete(k);
                });
              });
            }
          }
        } catch (e) {}

        if ('serviceWorker' in navigator) {
          var refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (refreshing) return;
            refreshing = true;
            window.location.reload();
          });
          window.addEventListener('load', function () {
            navigator.serviceWorker
              .register('/sw.js?v=25', { updateViaCache: 'none' })
              .then(function (reg) {
                reg.update();
              })
              .catch(function () {});
          });
        }
      })();
    </script>
